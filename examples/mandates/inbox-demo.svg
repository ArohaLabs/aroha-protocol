<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 250" width="860" height="250" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="14" role="img" aria-label="Terminal: node inbox.mjs. read-email allowed. propose-archive allowed. delete-email refused, CAPABILITY_NOT_PERMITTED. sub-agent chain valid, may read-email. widening: cannot attenuate, delete-email is not in the parent's allowed list.">
  <!-- Copyright (c) 2026 Aroha Labs. SPDX-License-Identifier: Apache-2.0 -->
  <rect width="860" height="250" rx="10" fill="#13261F"/>
  <rect width="860" height="30" rx="10" fill="#0E1D18"/>
  <rect y="20" width="860" height="10" fill="#0E1D18"/>
  <circle cx="20" cy="15" r="5" fill="#B3261E"/><circle cx="38" cy="15" r="5" fill="#B5621A"/><circle cx="56" cy="15" r="5" fill="#0F6E56"/>
  <text x="430" y="19" font-size="12" fill="#8FA69C" text-anchor="middle">examples/mandates</text>

  <g fill="#E1F5EE">
    <text x="20" y="60"><tspan fill="#5DCAA5">$</tspan> node inbox.mjs<tspan fill="#5DCAA5"><animate attributeName="opacity" values="1;0;1;0" dur="1s" repeatCount="indefinite"/>▍</tspan></text>

    <text x="20" y="92" opacity="0">read-email      → <tspan fill="#5DCAA5">allowed</tspan>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.12;0.125;0.97;1" dur="12s" repeatCount="indefinite"/></text>
    <text x="20" y="116" opacity="0">propose-archive → <tspan fill="#5DCAA5">allowed</tspan>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2;0.205;0.97;1" dur="12s" repeatCount="indefinite"/></text>
    <text x="20" y="140" opacity="0">delete-email    → <tspan fill="#F0A090">refused (CAPABILITY_NOT_PERMITTED)</tspan>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.3;0.305;0.97;1" dur="12s" repeatCount="indefinite"/></text>
    <text x="40" y="160" opacity="0" fill="#8FA69C" font-size="12">Capability "delete-email" is not in the mandate's allowed list
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.3;0.305;0.97;1" dur="12s" repeatCount="indefinite"/></text>
    <text x="20" y="190" opacity="0">sub-agent chain → <tspan fill="#5DCAA5">valid, may: read-email</tspan>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.44;0.445;0.97;1" dur="12s" repeatCount="indefinite"/></text>
    <text x="20" y="214" opacity="0">widening        → <tspan fill="#F0A090">Cannot attenuate: child allowed includes "delete-email"</tspan>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.56;0.565;0.97;1" dur="12s" repeatCount="indefinite"/></text>
    <text x="40" y="234" opacity="0" fill="#8FA69C" font-size="12">which is not in parent's allowed list
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.56;0.565;0.97;1" dur="12s" repeatCount="indefinite"/></text>
  </g>
</svg>
