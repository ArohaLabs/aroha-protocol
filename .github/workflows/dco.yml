name: DCO

# Every NEW commit in a pull request must carry a Developer Certificate of
# Origin sign-off ("Signed-off-by: Name <email>", added by `git commit -s`).
# See CONTRIBUTING.md "Developer Certificate of Origin".
#
# Cut-off: no commit made before the DCO was introduced carries a sign-off,
# and history is not rewritten to add one. A commit is exempt when EITHER
#   - it is an ancestor of DCO_EXEMPT_BASE (the tip of the audit-remediation
#     branch when this check was introduced), OR
#   - its committer date is before DCO_CUTOFF_DATE.
# Both values are recorded in CONTRIBUTING.md; change them only together.
#
# This replaces tisonkun/actions-dco, which cannot apply a cut-off and runs on
# the retired node12 Actions runtime.
#
# Not a required check: required status checks are unavailable on this
# repository's plan, so a failing DCO run is advisory (manual process: the
# reviewer must not merge a PR with a red DCO check).

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DCO_EXEMPT_BASE: 7473e091839c8686c1f804f7d58de4504f391c38
  DCO_CUTOFF_DATE: "2026-11-01T00:00:00Z"

jobs:
  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check sign-off on commits after the cut-off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          CUTOFF_EPOCH=$(date -u -d "$DCO_CUTOFF_DATE" +%s)
          HAVE_BASE=0
          git cat-file -e "${DCO_EXEMPT_BASE}^{commit}" 2>/dev/null && HAVE_BASE=1
          FAILED=0
          CHECKED=0
          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            if [ "$HAVE_BASE" = 1 ] && git merge-base --is-ancestor "$sha" "$DCO_EXEMPT_BASE"; then
              continue
            fi
            if [ "$(git show -s --format=%ct "$sha")" -lt "$CUTOFF_EPOCH" ]; then
              continue
            fi
            CHECKED=$((CHECKED + 1))
            AUTHOR_EMAIL=$(git show -s --format=%ae "$sha")
            if git show -s --format=%B "$sha" | grep -i '^Signed-off-by: ' | grep -qiF "<$AUTHOR_EMAIL>"; then
              echo "OK   $sha"
            else
              echo "::error::Commit $sha ($(git show -s --format=%s "$sha")) has no 'Signed-off-by:' line matching its author email <$AUTHOR_EMAIL>"
              FAILED=1
            fi
          done
          echo "Checked $CHECKED commit(s) after the DCO cut-off."
          if [ "$FAILED" = 1 ]; then
            echo "Fix with: git rebase --signoff $BASE_SHA  (then force-push your branch)."
            exit 1
          fi
