name: Publish — PyPI

# Acts only on a release tag python-v<version>, where <version> equals
# sdks/aroha-py/pyproject.toml's version (see CONTRIBUTING.md "Releasing").
# Triggered by a published GitHub Release, or by hand with the same tag — the
# tag↔version check runs on BOTH paths (it is also part of the Release
# Quality Gate, which runs first on the same commit).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g. python-v2.0.0 (run from that tag)"
        required: true
        type: string
      dry_run:
        description: "Dry run (build only, no publish)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve release tag
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'python-v'))
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        env:
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "release" ]; then TAG="$RELEASE_TAG"; else TAG="$INPUT_TAG"; fi
          case "$TAG" in
            python-v*) ;;
            *) echo "::error::'$TAG' is not a python-v<version> tag"; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  gate:
    name: Release Quality Gate
    needs: resolve
    uses: ./.github/workflows/release-gate.yml
    with:
      tag: ${{ needs.resolve.outputs.tag }}
    permissions:
      contents: read

  test:
    name: Test Python SDK
    needs: resolve
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/aroha-py
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      # Runs for release AND manual dispatch: a manual run must not be a way
      # around the version check.
      - name: Tag matches pyproject version
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          WANT="${RELEASE_TAG#python-v}"
          HAVE=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$WANT" != "$HAVE" ]; then
            echo "::error::Tag $RELEASE_TAG does not match pyproject version $HAVE"
            exit 1
          fi

      - name: Install SDK with dev extras
        run: pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

  publish:
    name: Publish aroha to PyPI
    needs: [resolve, gate, test]
    runs-on: ubuntu-latest
    # Required reviewers on `release` are a manual owner setting — see
    # CONTRIBUTING.md "Releasing". If PyPI trusted publishing is configured
    # with an environment name, it must be `release`.
    environment: release
    permissions:
      contents: read
      id-token: write   # required for PyPI trusted publishing (OIDC)

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install hatch

      - name: Build
        working-directory: sdks/aroha-py
        run: hatch build

      # No skip-existing: re-publishing a version that is already on PyPI is
      # an error (a released version is immutable), not a silent success. If a
      # re-run is genuinely needed after a partial upload, bump the version.
      - name: Publish to PyPI
        if: ${{ !inputs.dry_run }}
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: sdks/aroha-py/dist
