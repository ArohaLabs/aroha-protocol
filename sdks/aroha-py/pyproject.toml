[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "aroha"
version = "2.0.0"
description = "Aroha Protocol — Build and register agents with intelligent token-budget-aware model routing. Supports FastAPI, LangChain, CrewAI, Google ADK, OpenAI SDK."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = [
  "cryptography>=42.0.0",
  "httpx>=0.27.0",
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "base58>=2.1.1",
  "websockets>=12.0",
]

[project.optional-dependencies]
# Framework extras. Lower bounds are the first releases with the APIs the
# bridges use; tests/test_bridges_*.py ran against the versions named in each
# bridge's docstring (langchain-core 1.6, langgraph 1.2, crewai 1.15,
# autogen 0.7.5, google-adk 2.12, openai 2.54, openai-agents 0.20).
langchain     = ["langchain-core>=0.3.0"]
langgraph     = ["langchain-core>=0.3.0", "langgraph>=0.2.0"]
crewai        = ["crewai>=0.80.0"]
autogen       = ["autogen-core>=0.4.0", "autogen-agentchat>=0.4.0"]
google-adk    = ["google-adk>=1.0.0"]
openai        = ["openai>=1.30.0"]
openai-agents = ["openai-agents>=0.1.0"]
anthropic     = ["anthropic>=0.30.0"]
# Durable, shared stores (aroha.stores.postgres / aroha.stores.redis):
# nonces, enrollment and spending ledger for multi-process servers.
postgres      = ["psycopg[binary]>=3.1"]
redis         = ["redis>=5"]
all          = [
  "langchain-core>=0.3.0", "langgraph>=0.2.0",
  "crewai>=0.80.0",
  "autogen-core>=0.4.0", "autogen-agentchat>=0.4.0",
  "google-adk>=1.0.0",
  "openai>=1.30.0", "openai-agents>=0.1.0",
  "anthropic>=0.30.0",
]
dev        = ["pytest>=7.0.0", "pytest-asyncio>=0.23.0", "httpx>=0.27.0", "anyio>=4.0.0", "respx>=0.21.0"]

[project.urls]
Homepage = "https://www.aroha-labs.com"
Repository = "https://github.com/ArohaLabs/aroha-protocol"
Documentation = "https://aroha-labs.com/docs"

[tool.hatch.build.targets.wheel]
packages = ["aroha"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
  "integration: runs the built TypeScript packages under node (skipped when node or the dists are missing)",
]
