name: DCO

# Every NEW commit in a pull request must carry a Developer Certificate of
# Origin sign-off ("Signed-off-by: Name <email>", added by `git commit -s`).
# See CONTRIBUTING.md "Developer Certificate of Origin".
#
# Cut-off: no commit made before the DCO was introduced carries a sign-off,
# and history is not rewritten to add one. A commit is exempt when its
# committer date is before DCO_CUTOFF_DATE. The value is recorded in
# CONTRIBUTING.md; change both together.
#
# This replaces tisonkun/actions-dco, which cannot apply a cut-off and runs on
# the retired node12 Actions runtime.
#
# Not a required check: DCO is not in the "main" ruleset's required status
# checks, so a failing DCO run is advisory (manual process: the reviewer must
# not merge a PR with a red DCO check).

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DCO_CUTOFF_DATE: "2026-11-01T00:00:00Z"

jobs:
  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check sign-off on commits after the cut-off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          CUTOFF_EPOCH=$(date -u -d "$DCO_CUTOFF_DATE" +%s)
          FAILED=0
          CHECKED=0
          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            if [ "$(git show -s --format=%ct "$sha")" -lt "$CUTOFF_EPOCH" ]; then
              continue
            fi
            CHECKED=$((CHECKED + 1))
            AUTHOR_EMAIL=$(git show -s --format=%ae "$sha")
            if git show -s --format=%B "$sha" | grep -i '^Signed-off-by: ' | grep -qiF "<$AUTHOR_EMAIL>"; then
              echo "OK   $sha"
            else
              echo "::error::Commit $sha ($(git show -s --format=%s "$sha")) has no 'Signed-off-by:' line matching its author email <$AUTHOR_EMAIL>"
              FAILED=1
            fi
          done
          echo "Checked $CHECKED commit(s) after the DCO cut-off."
          if [ "$FAILED" = 1 ]; then
            echo "Fix with: git rebase --signoff $BASE_SHA  (then force-push your branch)."
            exit 1
          fi
