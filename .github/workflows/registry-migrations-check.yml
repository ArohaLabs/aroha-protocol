name: Registry — D1 migration drift check

# Manual, read-only check that every migration in
# apps/registry-server/migrations has been applied to the PRODUCTION D1
# database (`node scripts/migrate.mjs --check --remote`; exit 1 = pending
# migrations). It never applies anything — applying is the manual procedure
# in apps/registry-server/DEPLOY.md.
#
# Needs repository (or `release` environment) secrets CLOUDFLARE_API_TOKEN
# (D1 read permission on the account) and CLOUDFLARE_ACCOUNT_ID. Neither
# exists yet; the job fails fast with a clear message until the owner adds
# them. It runs in the `release` environment so that, once the plan allows,
# the owner can restrict it with required reviewers / environment secrets.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift-check:
    name: Pending remote migrations
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Fail fast when Cloudflare credentials are not provisioned
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing secret(s):$missing. The owner must add them (see apps/registry-server/DEPLOY.md) before this check can run."
            exit 1
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check for unapplied migrations
        working-directory: apps/registry-server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/migrate.mjs --check --remote
